name = "pigeon-mirror"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Run the scrape sweep every 2 minutes.
# In each invocation we process up to ~16 channels (CF free plan caps at
# 50 subrequests/invocation). Larger channel lists get sharded by tick.
[triggers]
crons = ["*/2 * * * *"]

# These are non-secret build/runtime constants. Secrets (GITHUB_TOKEN)
# are configured via `wrangler secret put`.
[vars]
GITHUB_OWNER = "MaroMushii"
GITHUB_REPO = "teleMirror"
GITHUB_BRANCH = "export"
GITHUB_CHANNELS_PATH = "worker/channels.json"
GITHUB_EXPORT_PREFIX = "export"
MAX_CHANNELS_PER_TICK = "16"
SCHEMA_VERSION = "1"
