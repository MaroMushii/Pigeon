name: release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Release v{0}', github.event.inputs.version) ||
      format('Release {0}', github.ref_name) }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z, no leading v). Will create the tag if it doesn't exist."
        required: true
        type: string

permissions:
  contents: write

# Don't let two release runs for the same ref clobber each other's
# uploaded assets. Different tags can run in parallel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # macOS 26 runner has the Xcode 26.x release whose actool fully
    # supports Icon Composer `.icon` bundles. The macos-15 image only
    # carries an early Xcode 26 beta, which fails to compile our app
    # icon at the asset-catalog stage.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$(mac/scripts/version.sh --version '${{ inputs.version }}')"
          else
            VERSION="$(mac/scripts/version.sh)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"
          echo "Resolved version: <$VERSION>"

      - name: Select latest Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "::error::no Xcode 26.x installed on this runner"
            echo "Installed Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none in /Applications)"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Build & package
        run: |
          mac/scripts/build.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --build   "${{ github.run_number }}"

      - name: Upload raw xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: mac/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Compute checksums
        working-directory: mac/dist
        run: |
          shasum -a 256 \
            "Pigeon-${{ steps.ver.outputs.version }}.zip" \
            "Pigeon-${{ steps.ver.outputs.version }}.dmg" \
            | tee SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"

          # Pull the annotated tag's body (commit list authored by
          # release.sh). %(contents:body) skips the subject line, leaving
          # just "Changes since vX.Y.Z:" + bullets. Falls back to empty
          # when the tag is lightweight (e.g. workflow_dispatch path).
          git fetch --tags --force --quiet origin "$TAG" || true
          TAG_BODY="$(git tag -l --format='%(contents:body)' "$TAG" 2>/dev/null || true)"

          NOTES_FILE="$(mktemp)"
          {
            echo "## Pigeon $VERSION"
            echo
            if [[ -n "$TAG_BODY" ]]; then
              echo "$TAG_BODY"
              echo
            fi
            cat <<NOTES
          Native macOS reader for Telegram public channels. Designed to keep
          working on heavily filtered networks.

          ### Installation

          Download \`Pigeon-$VERSION.dmg\` (or the \`.zip\`) below.

          This build is **ad-hoc signed**, so on first launch macOS will
          refuse to open it ("can't be opened, developer cannot be
          verified"). To clear the quarantine flag:

          \`\`\`sh
          xattr -cr /Applications/Pigeon.app
          \`\`\`

          Or right-click the app in Finder → Open → Open anyway in the
          warning dialog. You only need to do this once.

          ### Requirements

          - macOS 26 (Tahoe) or later
          - Apple Silicon or Intel

          ### Verifying the download

          Compare against \`SHA256SUMS.txt\`:

          \`\`\`sh
          shasum -a 256 -c SHA256SUMS.txt
          \`\`\`
          NOTES
          } > "$NOTES_FILE"

          ASSETS=(
            "mac/dist/Pigeon-$VERSION.zip"
            "mac/dist/Pigeon-$VERSION.dmg"
            "mac/dist/SHA256SUMS.txt"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading (clobbering) assets"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "Pigeon $VERSION" \
              --notes-file "$NOTES_FILE" \
              --generate-notes \
              --target "${{ github.sha }}" \
              "${ASSETS[@]}"
          fi

      - name: Update appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"

          SPARKLE_VERSION="2.9.1"
          SPARKLE_DIR="$(mktemp -d)"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJ -C "$SPARKLE_DIR"

          # Seed from the release branch so previous entries are preserved.
          git fetch origin release
          git show origin/release:appcast.xml > appcast.xml 2>/dev/null || true

          mac/scripts/update-appcast.sh "$SPARKLE_DIR/bin" "$VERSION" "mac/dist/Pigeon-$VERSION.dmg"

          # Push only to the release branch — never touches main.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add /tmp/release-branch release

          # DMG lives in release/dist/ so raw.githubusercontent.com can serve it
          # (release-assets.githubusercontent.com is blocked in Iran).
          mkdir -p /tmp/release-branch/dist
          cp "mac/dist/Pigeon-$VERSION.dmg" /tmp/release-branch/dist/

          # Keep only the 5 most recent DMGs (matches --maximum-versions 5 in appcast).
          ls -t /tmp/release-branch/dist/Pigeon-*.dmg 2>/dev/null \
            | tail -n +6 \
            | xargs -r git -C /tmp/release-branch rm --force --quiet

          cp appcast.xml /tmp/release-branch/appcast.xml
          git -C /tmp/release-branch add appcast.xml dist/
          git -C /tmp/release-branch diff --cached --quiet && echo "appcast unchanged, skipping commit" && exit 0
          git -C /tmp/release-branch commit -m "chore(release): update appcast + dist for v${VERSION}"
          git -C /tmp/release-branch push origin release
          git worktree remove /tmp/release-branch
