name: Pigeon

options:
  bundleIdPrefix: dev.MaroMushii
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.5
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: 12.8.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  Pigeon:
    type: application
    platform: macOS
    sources:
      - path: Pigeon
        excludes:
          - Resources/popular-channel-avatars
      # Folder reference: preserves the directory structure in the
      # built bundle so `Bundle.main.url(forResource:..subdirectory:)`
      # can find avatars by their channel-name filenames without
      # risking collisions against other top-level resources.
      - path: Pigeon/Resources/popular-channel-avatars
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: Sparkle
        product: Sparkle
    info:
      path: Pigeon/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.social-networking
        NSHumanReadableCopyright: "Pigeon. A native Telegram channel reader."
        NSPrincipalClass: NSApplication
        SUFeedURL: "https://raw.githubusercontent.com/MaroMushii/Pigeon/refs/heads/release/appcast.xml"
        SUPublicEDKey: "KaC3IdC3ViUMPWuxN+RDobm8R1JTPmCY0lMRjLWgYAE="
        SUEnableAutomaticChecks: true
        # ATS exception scoped to the Google Translate domain-proxy host.
        # `PinnedHTTPSClient` talks plain NWConnection (ATS doesn't govern
        # those), but `PinnedURLProtocol`'s synthesised HTTPURLResponse
        # carries a `*.translate.goog` URL that URLSession introspects —
        # without an exception entry, ATS rejects the response before Nuke
        # ever sees it. Scope it tightly here instead of the previous
        # blanket `NSAllowsArbitraryLoads: YES`, so any future code that
        # accidentally talks to an arbitrary host gets blocked.
        NSAppTransportSecurity:
          NSExceptionDomains:
            translate.goog:
              NSIncludesSubdomains: YES
              NSExceptionAllowsInsecureHTTPLoads: NO
              NSExceptionRequiresForwardSecrecy: NO
              NSExceptionMinimumTLSVersion: TLSv1.2
    entitlements:
      path: Pigeon/Resources/Pigeon.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.MaroMushii.Pigeon
        PRODUCT_NAME: Pigeon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: Pigeon
        COMBINE_HIDPI_IMAGES: YES

  PigeonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PigeonTests
    dependencies:
      - target: Pigeon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.MaroMushii.PigeonTests
        PRODUCT_NAME: PigeonTests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pigeon.app/Contents/MacOS/Pigeon"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  Pigeon:
    build:
      targets:
        Pigeon: all
        PigeonTests: [test]
    test:
      config: Debug
      targets:
        - PigeonTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
